name = "scb"
main = ".open-next/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "scb"
database_id = "c283f494-297e-4615-9e88-6dd9c581990f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "scb-media"

[vars]
NEXT_PUBLIC_SITE_URL = "https://scb.luckypoem.workers.dev"
NEXT_PUBLIC_SITE_NAME = "LordVibeCoding'blog"
# Giscus 未配置：评论区显示“尚未启用”占位。启用方法：仓库开 Discussions + 装 Giscus app，
# 再把下面四个值填回来（从 https://giscus.app 获取）。
# NEXT_PUBLIC_GISCUS_REPO = "brightmann/scb"
# NEXT_PUBLIC_GISCUS_REPO_ID = ""
# NEXT_PUBLIC_GISCUS_CATEGORY = "General"
# NEXT_PUBLIC_GISCUS_CATEGORY_ID = ""
# R2 公开域名（启用 R2 后在 dashboard 配 custom domain，部署后更新此处）
NEXT_PUBLIC_R2_PUBLIC_URL = "https://media.okl.la"

# 这些字段在部署后通过 wrangler secret put 设置，不在配置文件
# - ADMIN_USERNAME
# - ADMIN_PASSWORD_ITER
# - ADMIN_PASSWORD_SALT
# - ADMIN_PASSWORD_HASH
# - SESSION_SECRET

[observability]
enabled = true
